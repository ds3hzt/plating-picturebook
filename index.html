<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#103858">
  <title>도금 그림백과 — 용어 한 페이지씩</title>
  <style>
    :root { --navy:#103858; --blue:#17668f; --sky:#eaf4ff; --ink:#172b3b; --muted:#596f82; --line:#c7dced; --gold:#f0ad24; --red:#d6453d; --s:1;
      font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif; }
    * { box-sizing:border-box; }
    body { margin:0; background:#dfe8f0; color:var(--ink); }
    @page { size:297mm 210mm; margin:0; }

    /* 화면용 도구줄 */
    .toolbar { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px; padding:9px 16px; background:var(--navy); color:#fff; box-shadow:0 2px 10px rgb(0 0 0/20%); }
    .toolbar a, .toolbar button { color:#fff; font:inherit; font-size:.85rem; font-weight:800; text-decoration:none; background:rgb(255 255 255/14%); border:0; border-radius:9px; padding:7px 12px; cursor:pointer; }
    .toolbar input { flex:1; max-width:320px; min-height:34px; padding:0 12px; border:0; border-radius:9px; font:inherit; font-size:.88rem; }
    .toolbar .count { margin-left:auto; font-size:.8rem; color:#bce6ff; white-space:nowrap; }

    .book { display:flex; flex-direction:column; align-items:center; gap:18px; padding:20px 0 50px; }
    .slot { width:calc(1123px*var(--s)); height:calc(794px*var(--s)); }
    .page { width:1123px; height:794px; transform:scale(var(--s)); transform-origin:top left; position:relative; overflow:hidden; background:#f4f8fc; box-shadow:0 8px 28px rgb(20 61 91/20%); }
    .inner { position:absolute; inset:0; padding:26px 32px 30px; display:flex; flex-direction:column; gap:10px; }

    /* 용어 페이지 */
    .banner { display:flex; align-items:center; gap:18px; padding:14px 20px; border-radius:18px; color:#fff; background:linear-gradient(118deg,#102d49,#155279 75%,#236e96); }
    .ic { flex:0 0 64px; height:64px; display:grid; place-items:center; border-radius:18px; background:rgb(255 255 255/16%); font-size:2.3rem; }
    .nm h1 { margin:0; font-size:2.25rem; letter-spacing:-.04em; line-height:1.1; white-space:nowrap; }
    .chip { display:inline-block; margin-top:6px; padding:3px 11px; border-radius:20px; background:rgb(255 255 255/18%); color:#bce6ff; font-size:.8rem; font-weight:800; }
    .def { flex:1; margin:0; padding:12px 18px; border-radius:14px; background:#fff; color:var(--ink); font-size:1.02rem; font-weight:700; line-height:1.5; }
    .pno { align-self:flex-start; color:#9fd2f2; font-size:.78rem; font-weight:800; }
    .hook { display:flex; align-items:center; gap:10px; padding:7px 16px; border-radius:12px; background:#fff7e1; border-left:5px solid var(--gold); font-size:.97rem; font-weight:800; color:#6a4a08; }
    .steps { flex:none; display:grid; grid-template-columns:repeat(3,1fr); gap:20px; align-items:stretch; }
    .scard { position:relative; display:flex; flex-direction:column; padding:10px 10px 12px; border:1px solid var(--line); border-radius:16px; background:#fff; box-shadow:0 5px 16px rgb(20 61 91/8%); }
    .scard h3 { margin:0 0 7px; font-size:1.05rem; color:var(--navy); display:flex; align-items:center; gap:8px; }
    .scard h3 .n { display:grid; place-items:center; width:26px; height:26px; border-radius:50%; background:var(--blue); color:#fff; font-size:.85rem; }
    .scard svg { display:block; width:100%; height:auto; border-radius:11px; }
    .scard p { margin:9px 3px 0; font-size:.98rem; line-height:1.5; color:#3b5163; }
    .scard .go { position:absolute; right:-17px; top:44%; z-index:3; color:var(--blue); font-size:1.4rem; font-weight:900; }
    .bottom { flex:1; min-height:0; display:grid; grid-template-columns:1.25fr 1.15fr .9fr; gap:12px; }
    .bx { padding:12px 16px; border:1px solid var(--line); border-radius:16px; background:#fff; }
    .bx h4 { margin:0 0 8px; font-size:.86rem; font-weight:900; letter-spacing:.04em; color:var(--blue); }
    .bx ul { margin:0; padding:0; list-style:none; }
    .bx li { display:flex; gap:8px; padding:5px 0; font-size:.95rem; line-height:1.45; }
    .bx li b { color:var(--navy); white-space:nowrap; }
    .bx li i { flex:0 0 18px; height:18px; display:grid; place-items:center; border-radius:50%; background:#e1f3e9; color:#1f8a55; font-size:.65rem; font-style:normal; font-weight:900; margin-top:1px; }
    .bx p { margin:0; font-size:.95rem; line-height:1.5; }
    .bx .ex strong { color:#d28a16; }
    .bx .care { margin-top:6px; padding:6px 10px; border-radius:9px; background:#fff0ee; color:#8a2a24; font-weight:700; }
    .rel { display:flex; flex-wrap:wrap; gap:6px; }
    .rel a { padding:4px 10px; border-radius:20px; background:var(--sky); color:var(--blue); font-size:.8rem; font-weight:800; text-decoration:none; }
    .more { display:inline-block; margin-top:7px; font-size:.78rem; font-weight:800; color:var(--blue); }
    .soon { margin-top:8px; font-size:.78rem; color:#8a97a3; }

    /* 표지·목차 */
    .cover { position:absolute; inset:0; background:linear-gradient(125deg,#0d2a44,#155279 70%,#2b86ae); color:#fff; }
    .cover .inner { justify-content:center; padding:70px 90px; gap:14px; }
    .cover .eb { color:#bce6ff; font-weight:900; letter-spacing:.16em; font-size:1rem; }
    .cover h1 { margin:0; font-size:5.4rem; letter-spacing:-.06em; line-height:1.05; }
    .cover h1 span { color:#8ed3ff; }
    .cover p { margin:6px 0 0; max-width:640px; font-size:1.3rem; line-height:1.6; color:#e5f4ff; }
    .cover .facts { display:flex; gap:14px; margin-top:26px; }
    .cover .facts div { padding:12px 22px; border-radius:16px; background:rgb(255 255 255/12%); font-weight:800; }
    .cover .facts b { display:block; font-size:2rem; color:#ffd36a; }
    .cover .deco { position:absolute; right:60px; top:90px; font-size:15rem; opacity:.18; }
    .toc h2 { margin:0; font-size:1.7rem; color:var(--navy); }
    .toc .cols { flex:1; column-count:4; column-gap:22px; font-size:.84rem; line-height:1.62; }
    .toc .cat { break-inside:avoid; margin:8px 0 3px; padding:3px 10px; border-radius:8px; background:var(--navy); color:#fff; font-weight:900; font-size:.8rem; }
    .toc .cols a { display:flex; justify-content:space-between; gap:6px; color:var(--ink); text-decoration:none; break-inside:avoid; border-bottom:1px dotted #c3d3e0; }
    .toc .cols a span { color:var(--blue); font-weight:800; }

    @media print {
      body { background:#fff; } .toolbar { display:none; } .book { display:block; padding:0; }
      :root { --s:1 !important; } .slot { width:297mm; height:210mm; break-after:page; overflow:hidden; }
      .page { box-shadow:none; transform:none; width:100%; height:100%; zoom:.9999; }
      * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    }
  </style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" id="defs-holder"></svg>
<div class="toolbar">
  <strong style="font-size:.95rem">도금 그림백과</strong>
  <input id="jump" list="names" placeholder="용어를 입력해 해당 페이지로 이동" autocomplete="off">
  <datalist id="names"></datalist>
  <button type="button" onclick="window.print()">🖨 PDF로 저장(인쇄)</button>
  <span class="count" id="count"></span>
</div>
<main class="book" id="book"></main>

<script src="terms.js"></script>
<script src="g/lib.js"></script>
<script src="g/p0.js"></script>
<script src="g/p1.js"></script>
<script src="g/p2.js"></script>
<script src="g/p3.js"></script>
<script src="g/p4.js"></script>
<script src="g/p5.js"></script>
<script src="g/p6.js"></script>
<script src="g/p7.js"></script>
<script>
(() => {
  document.getElementById('defs-holder').innerHTML = S.defs;
  const PAGES = window.PAGES || {};
  const ORDER = ['소재·기초','전처리','도금 종류','약품·욕 관리','공정·설비','후처리','검사·품질','불량·대책','환경·안전'];
  const ko = (a, b) => a.name.localeCompare(b.name, 'ko');
  const terms = [...window.PLATING_TERMS].sort((a, b) => {
    const ia = ORDER.indexOf(a.category), ib = ORDER.indexOf(b.category);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib) || ko(a, b);
  });
  const esc = S.esc, book = document.getElementById('book');
  const slot = html => { const d = document.createElement('div'); d.className = 'slot'; d.innerHTML = `<div class="page">${html}</div>`; book.append(d); return d; };

  // 목차 줄 구성(분야 머리글 + 용어), 페이지 수 계산
  const LINES_PER_PAGE = 4 * 29;
  const tocRows = [];
  ORDER.forEach(cat => { const list = terms.filter(t => t.category === cat); if (!list.length) return; tocRows.push({ cat }); list.forEach(t => tocRows.push({ t })); });
  const sortedKo = [...terms].sort(ko);
  const idxRows = []; let lastInit = '';
  const INIT = 'ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ';
  const initial = n => { const c = n.codePointAt(0); return c >= 0xac00 && c <= 0xd7a3 ? INIT[Math.floor((c - 0xac00) / 588)] : n[0].toUpperCase(); };
  sortedKo.forEach(t => { const i = initial(t.name); if (i !== lastInit) { idxRows.push({ cat: i }); lastInit = i; } idxRows.push({ t }); });
  const chunk = (rows, n) => { const out = []; for (let i = 0; i < rows.length; i += n) out.push(rows.slice(i, i + n)); return out; };
  const tocPages = chunk(tocRows, LINES_PER_PAGE), idxPages = chunk(idxRows, LINES_PER_PAGE);
  const offset = 1 + tocPages.length + idxPages.length;           // 용어 첫 페이지 번호 = offset + 1
  // 용어별 페이지 수: 기본 1장, p.extra 가 있으면 "계속" 1장 추가
  const pageOf = new Map(); const startNo = []; let cur = offset + 1;
  terms.forEach((t, i) => { startNo[i] = cur; pageOf.set(t.name, cur); cur += 1 + ((PAGES[t.name] && PAGES[t.name].extra) ? 1 : 0); });
  const totalPages = cur - 1;
  const anchor = name => 't-' + terms.findIndex(t => t.name === name);

  // 표지
  const covered = terms.filter(t => PAGES[t.name]).length;
  slot(`<div class="cover"><div class="inner">
    <div class="eb">PLATING ILLUSTRATED GLOSSARY</div>
    <h1>도금 <span>그림백과</span></h1>
    <p>용어 하나에 한 페이지.<br>그림으로 보고, 짧게 읽고, 현장에서 바로 써요.</p>
    <div class="facts"><div><b>${terms.length}</b>용어</div><div><b>${totalPages}</b>페이지</div><div><b>${ORDER.length}</b>분야</div></div>
    <div class="deco">🪙</div></div></div>`);

  const tocHtml = (title, pages, i) => `<div class="toc"><div class="inner"><h2>${title}${pages.length > 1 ? ` (${i + 1}/${pages.length})` : ''}</h2><div class="cols">` +
    pages[i].map(r => r.cat ? `<div class="cat">${esc(r.cat)}</div>` : `<a href="#${anchor(r.t.name)}">${esc(r.t.name)}<span>${pageOf.get(r.t.name)}</span></a>`).join('') + `</div></div></div>`;
  tocPages.forEach((_, i) => slot(tocHtml('목차 — 분야별', tocPages, i)));
  idxPages.forEach((_, i) => slot(tocHtml('찾아보기 — 가나다순', idxPages, i)));

  // 용어 페이지
  terms.forEach((t, i) => {
    const p = PAGES[t.name];
    const rel = p && p.related ? p.related.filter(n => pageOf.has(n)) : [];
    let body;
    if (p) {
      body = `
      <div class="hook">💡 <span>쉽게 말하면 — ${esc(p.hook)}</span></div>
      <div class="steps">${p.steps.map((s, k) => `<div class="scard"><h3><span class="n">${k + 1}</span>${esc(s.t)}</h3>${s.svg}<p>${esc(s.d)}</p>${k < 2 ? '<span class="go">▶</span>' : ''}</div>`).join('')}</div>
      <div class="bottom">
        <div class="bx"><h4>핵심 포인트</h4><ul>${p.points.map(x => `<li><i>✔</i><span><b>${esc(x.k)}</b> · ${esc(x.v)}</span></li>`).join('')}</ul></div>
        <div class="bx"><h4>현장에서는</h4><p class="ex">${esc(t.example)}</p><p class="care">⚠ ${esc(p.care)}</p></div>
        <div class="bx"><h4>함께 보면 좋은 용어</h4><div class="rel">${rel.map(n => `<a href="#${anchor(n)}">${esc(n)} · p.${pageOf.get(n)}</a>`).join('')}</div>${t.link ? `<a class="more" href="${t.link}">🖼 상세 그림 자료 →</a>` : ''}</div>
      </div>`;
    } else {
      body = `<div class="hook">💡 <span>쉽게 말하면 — ${esc(t.desc)}</span></div>
      <div class="steps" style="grid-template-columns:1fr"><div class="scard" style="justify-content:center;align-items:center;text-align:center"><div style="font-size:6rem">${t.icon}</div><p>그림 자료를 준비 중이에요.</p></div></div>
      <div class="bottom" style="grid-template-columns:1fr"><div class="bx"><h4>현장에서는</h4><p class="ex">${esc(t.example)}</p></div></div>`;
    }
    const d = slot(`<div class="inner" id="t-${i}">
      <div class="banner"><div class="ic">${t.icon}</div><div class="nm"><h1>${esc(t.name)}</h1><span class="chip">${esc(t.category)}</span></div><p class="def">${esc(t.desc)}</p><span class="pno">p.${startNo[i]}</span></div>${body}</div>`);
    d.id = 'p-' + i;
    if (p && p.extra) {
      const x = p.extra, n = x.steps.length;
      const xd = slot(`<div class="inner">
        <div class="banner"><div class="ic">${t.icon}</div><div class="nm"><h1>${esc(t.name)}</h1><span class="chip">${esc(t.category)} · 계속</span></div><p class="def">${esc(x.hook || t.desc)}</p><span class="pno">p.${startNo[i] + 1}</span></div>
        <div class="steps" style="grid-template-columns:repeat(${n},1fr)">${x.steps.map((s, k) => `<div class="scard"><h3><span class="n">${k + 1}</span>${esc(s.t)}</h3>${s.svg}<p>${esc(s.d)}</p>${k < n - 1 ? '<span class="go">▶</span>' : ''}</div>`).join('')}</div>
        ${x.points && x.points.length ? `<div class="bottom" style="grid-template-columns:1fr"><div class="bx"><h4>더 알아두기</h4><ul>${x.points.map(q => `<li><i>✔</i><span><b>${esc(q.k)}</b> · ${esc(q.v)}</span></li>`).join('')}</ul></div></div>` : ''}</div>`);
      xd.id = 'p-' + i + '-x';
    }
  });

  // ?only=용어1,용어2 → 해당 페이지만 표시(미리보기·검수용)
  const only = new URLSearchParams(location.search).get('only');
  if (only) { const keep = new Set(only.split(',').map(n => terms.findIndex(t => t.name === n))); book.querySelectorAll('.slot').forEach(s => { if (!keep.has(parseInt(s.id.replace('p-', ''), 10))) s.remove(); }); }

  // 도구줄: 검색 이동 + 화면 크기 맞춤
  document.getElementById('count').textContent = `${terms.length}개 용어 · 그림 완성 ${covered}`;
  const dl = document.getElementById('names'); terms.forEach(t => { const o = document.createElement('option'); o.value = t.name; dl.append(o); });
  document.getElementById('jump').addEventListener('change', e => { const i = terms.findIndex(t => t.name === e.target.value.trim()); if (i >= 0) { document.getElementById('p-' + i).scrollIntoView({ behavior: 'smooth', block: 'start' }); e.target.value = ''; } });
  const fit = () => document.documentElement.style.setProperty('--s', Math.min(1, (document.documentElement.clientWidth - 24) / 1123).toFixed(3));
  addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
